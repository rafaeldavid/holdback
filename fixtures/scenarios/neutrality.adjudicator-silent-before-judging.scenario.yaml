# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 29
name: neutrality.adjudicator-silent-before-judging
description: >-
  ADR-0016 stall before judging. Bench A accepts and reserves bond, then goes silent before the hold is
  even funded. Atlas funds and Tidewater delivers anyway; once judgeBy passes, anyone triggers the
  fallback and Bench B decides with the beacon-derived panel seed (ADR-0018). $2,000 releases to Tidewater.
  The beacon round is not yet rendered in the snapshot (T-016).
fails: bench-a
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - offline:            { actor: bench-a }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
  - advance_clock:      { seconds: 172920 }           # past judgeBy (offer + 48 h + 120 s)
  - trigger_fallback:   { via: op-1 }
  - judge:              { adjudicator: bench-b }
  - verify_key_release: { by: buyer, via: op-1 }
expect:
  terminal: Released
  balances:
    atlas-buyer: "7950000000"
    tidewater-seller: "2000000000"
    bench-a: "25000000000"
    bench-b: "25050000000"            # the fallback that decided earns the $50 fee
    escrow: "0"

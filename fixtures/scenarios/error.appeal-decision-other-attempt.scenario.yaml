# @settlement sim @judges fake @mode guaranteed_on_decision @seed 43
name: error.appeal-decision-other-attempt
description: >-
  T-206 H-1. Tidewater's delivery has one name cell past the sampling budget, so Bench A's judges see only the
  even-stride sample and Bench A escalates; under D27b Bench C rejects such a delivery at once. The panel seed
  hashes the attempt, so an appeal adjudicator free to name any attempt could pick among 256 valid seeds and sign
  the panel it prefers. Bench C first signs its decision for attempt 2, with the beacon seed for attempt 2:
  settlement refuses it (invalid_terms), because every role judges the delivered attempt, as HoldbackRules does.
  Bench C then signs the same judgment for attempt 1, and Atlas is refunded. Judges are fake passes; the outcome
  does not depend on them.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.long-record.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }                        # stride sample: escalate
  - judge:              { adjudicator: bench-c, tamper: wrong_attempt } # attempt 2 with its own seed: refused
  - judge:              { adjudicator: bench-c }                        # the same judgment for attempt 1: reject
expect:
  problem: { type: invalid_terms, step: 7 }
  terminal: Refunded
  balances:
    atlas-buyer: "9950000000"
    tidewater-seller: "0"
    bench-c: "25050000000"

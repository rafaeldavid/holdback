# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 59
name: todo.provider-outage
description: >-
  The scenario index's neutrality.provider-outage row, recorded as a known gap. The second-family provider
  is down, so its judge abstains (authored recording, capturedFrom fake). The two Claude judges pass, but
  one family is below the panel's two-family minimum, so Bench A escalates instead of accepting. A model
  provider is not a scenario actor, so the neutrality. prefix (fails:) cannot name it, and the appeal panel
  replays the same recordings, so the run stops at Escalated. Promote once the testkit models providers.
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }

# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 101
name: todo.adjudicator-leaks-plaintext
description: >-
  Residual control point 6 (docs/neutrality.md): an adjudicator that decrypts the deliverable to judge it
  can copy or leak the work without any decision, and no bond or appeal reaches that. This run is an
  ordinary release; the gap is what it cannot show. The testkit's delivery also wraps the content key
  for Bench B and Bench C at delivery time, wider than ADR-0020's "only when they take over" (see
  neutrality.fallback-key-on-takeover in the T-010 Handoff). Kept as todo until confidential-compute
  judging or local-only judges (policy.providerPrivacy) can be asserted.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
expect:
  terminal: Released

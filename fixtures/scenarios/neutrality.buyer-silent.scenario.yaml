# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 43
name: neutrality.buyer-silent
description: >-
  Atlas funds the hold and then goes silent: it never accepts early, never appeals, never fetches its key.
  Judgment runs without the buyer. Bench A accepts and $2,000 releases to Tidewater at the decision; the
  buyer's content key is released in the same step and waits for Atlas.
fails: atlas-buyer
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - offline:            { actor: atlas-buyer }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
  - settle:             { trigger: seller, via: op-1 }
  - verify_key_release: { by: buyer, via: op-1 }     # no call: Atlas is offline
expect:
  terminal: Released
  balances:
    atlas-buyer: "7950000000"
    tidewater-seller: "2000000000"
    bench-a: "25050000000"
    escrow: "0"

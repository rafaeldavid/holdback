# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 328
name: reference-check-rejected
description: >-
  T-327. The terms of reference-check-accepted, and a delivery that drops 8% of rows, two of them among the 40
  customers Atlas already holds. Bench A reads the reference from its store by the committed hash, the required
  check matches 38 of 40, below the 10,000 bps the terms ask, and Bench A rejects with no panel: Atlas gets the
  price back and Bench A earns the fee.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-reference.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.row-drop.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
  - settle:             { trigger: anyone }
expect:
  terminal: Refunded

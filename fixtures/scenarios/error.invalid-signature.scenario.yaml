# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 67
name: error.invalid-signature
description: >-
  Tidewater tries to agree and fund on Atlas's behalf: the Agree message names Atlas as buyer but is
  signed with Tidewater's key. SimChain checks the EIP-712 signature against the buyer's address and
  refuses it with invalid_signature; nothing is agreed or held.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1, signer: tidewater-seller }
expect:
  problem: { step: 3, type: invalid_signature }
  balances:
    atlas-buyer: "10000000000"
    escrow: "0"

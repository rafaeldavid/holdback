# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 103
name: todo.principal-no-recourse
description: >-
  Residual control point 12 (docs/neutrality.md, D22). Atlas's agent commits and funds within its mandate;
  the work is accepted and $2,000 is final to Tidewater at the decision. Nothing in the protocol lets
  Atlas's principal reverse it afterwards: revoking the mandate stops new commitments only, and loss on a
  live commitment is bounded by the scope caps. Recourse lies between the principal and its agent provider.
  The testkit has no revoke-mandate step, so this run records the release the principal cannot undo.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
expect:
  terminal: Released
  balances:
    atlas-buyer: "7950000000"
    tidewater-seller: "2000000000"

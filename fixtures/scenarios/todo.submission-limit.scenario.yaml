# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 79
name: todo.submission-limit
description: >-
  The scenario index's error.submission-limit row, recorded as a known gap. The club allows one
  submission. Tidewater delivers, then tries a second delivery; core refuses an attempt above
  maxSubmissions with submission_limit_reached, but the testkit always signs attempt 1, so the second
  delivery is refused as invalid_state (Delivered is not Held) instead. Promote to error.submission-limit
  once the deliver step takes an attempt number.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.row-drop.csv }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
expect:
  problem: { step: 5, type: submission_limit_reached }

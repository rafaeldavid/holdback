# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 53
name: todo.operator-offline
description: >-
  The scenario index's neutrality.operator-offline row, recorded as a known gap. op-1 goes offline after
  relaying the offer, yet the testkit still relays the agree, fund and delivery through op-1: an offline
  step only blocks calls whose acting party is offline, never calls routed via an offline operator, so the
  fixture cannot show op-1 failing. Promote once the testkit treats "offline operator" like
  operator_refuses (then route steps 4-5 via op-2 or direct).
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - offline:            { actor: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }     # should be blocked: op-1 is offline
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
expect:
  terminal: Released                # today's outcome, and still the desired one once promoted

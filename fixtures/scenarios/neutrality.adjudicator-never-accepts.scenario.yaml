# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 31
name: neutrality.adjudicator-never-accepts
description: >-
  ADR-0016: an adjudicator can refuse a case only before any funds are held. Tidewater offers terms naming
  Bench A, which is offline and never accepts. Nothing is held; after offerExpiresAt anyone expires the
  offer, and every balance is unchanged.
fails: bench-a
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - offline:            { actor: bench-a }
  - adjudicator_accept: { via: op-1 }                 # no call: Bench A is offline
  - advance_clock:      { seconds: 900 }              # past offerExpiresAt (offer + 900 s)
  - expire:             { via: op-2 }
expect:
  terminal: Expired
  balances:
    atlas-buyer: "10000000000"
    tidewater-seller: "0"
    bench-a: "25000000000"
    escrow: "0"

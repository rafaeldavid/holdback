# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 43
name: neutrality.deploy-changes-policy-fallback
description: >-
  ADR-0036, the fallback variant. A deal accepted on a build whose default is screen-0; the operators deploy a build
  whose default is screen-1, and Bench A then goes offline. After judgeBy anyone triggers the fallback, and Bench B,
  on the new build, judges under screen-0, the screen the terms bound. $2,000 releases to Tidewater.
fails: bench-a
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - restart_adjudicators: { screen: screen-0 }
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
  - restart_adjudicators: { screen: screen-1 }
  - offline:            { actor: bench-a }
  - advance_clock:      { seconds: 172920 }           # past judgeBy
  - trigger_fallback:   { via: op-2 }
  - judge:              { adjudicator: bench-b }
  - verify_key_release: { by: buyer, via: op-2 }
expect:
  terminal: Released
  balances:
    atlas-buyer: "7950000000"
    tidewater-seller: "2000000000"
    bench-a: "25000000000"
    bench-b: "25050000000"
    escrow: "0"

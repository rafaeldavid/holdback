# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 53
name: neutrality.operator-offline
description: >-
  op-1 relays the offer and Bench A's acceptance, then goes offline. Atlas's agree and fund through op-1
  are not relayed, so Atlas sends them through op-2 instead, and Tidewater delivers directly to the
  settlement layer. No operator is required: the commitment is judged and settles as if op-1 had never
  failed. Promoted from todo. by T-016 (an offline operator relays nothing).
fails: op-1
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - offline:            { actor: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }     # not relayed: op-1 is offline
  - agree_and_fund:     { by: buyer, via: op-2 }
  - deliver:            { by: seller, file: data/dataset-cleaning/customers.clean.csv }   # direct submit
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
expect:
  terminal: Released
  balances:
    atlas-buyer: "7950000000"
    tidewater-seller: "2000000000"

# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 329
name: neutrality.store-withholds-reference
description: >-
  T-327 review, finding 2. The terms require a reference file, and after the adjudicators agreed to serve the deal
  their content store stops returning it. Bench A does not judge without it and publishes nothing; after judgeBy
  anyone triggers the fallback, and Bench B does not judge either; after fallbackBy anyone triggers the default and
  applies the default outcome from the signed rulebook. No store's refusal decides the deal: it settles by the path
  the terms set for adjudicators that do not decide. Atlas gets its price and fee back, and the two bonds pay
  Tidewater, as when both adjudicators are offline. Each adjudicator reads its own store, so the failing actor is
  the adjudicator whose store withholds the file; `fails:` takes one name, so it names Bench B, the last one to miss
  its deadline.
fails: bench-b
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-reference-withheld.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:                 { by: seller, via: op-1 }
  - adjudicator_accept:    { via: op-1 }
  - agree_and_fund:        { by: buyer, via: op-1 }
  - deliver:               { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv }
  - judge:                 { adjudicator: bench-a }   # refused: the store does not return the reference
  - advance_clock:         { seconds: 172920 }        # past judgeBy (offer + 48 h + 120 s)
  - trigger_fallback:      { via: op-2 }
  - judge:                 { adjudicator: bench-b }   # refused: the store does not return the reference
  - advance_clock:         { seconds: 120 }           # past fallbackBy (judgeBy + 120 s)
  - trigger_default:       { via: op-2 }
  - apply_default_outcome: { via: op-2 }
expect:
  terminal: Refunded

# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 319
name: audit-report-reordered
description: >-
  The audit-report template (T-317), checks-only. Tidewater's report lists the three files in scope in
  another order than the terms. The coverage check compares the lists as sets, so the report passes and
  Bench A accepts with no panel.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/audit-report.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/audit-report/report.reordered.json }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
  - settle:             { trigger: anyone }
  - verify_key_release: { by: buyer }
expect:
  terminal: Released
  balances:
    atlas-buyer: "8450000000"
    tidewater-seller: "1500000000"
    bench-a: "25050000000"

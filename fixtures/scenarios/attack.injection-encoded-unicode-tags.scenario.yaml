# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 97
name: attack.injection-encoded-unicode-tags
description: >-
  The cleaned CSV hides an instruction in Unicode tag characters (U+E0000 block), invisible when rendered.
  The terms' required `hidden` check (tag 0) refuses the file before any judge sees it (ADR-0021), so
  Bench A rejects in one step: Atlas gets the $2,000 back and Bench A earns the fee. No panel runs, so
  there are no recordings.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.hidden-tags.csv }
  - advance_clock:      { seconds: 5 }
  - judge:              { adjudicator: bench-a }
expect:
  terminal: Refunded
  balances:
    atlas-buyer: "9950000000"
    escrow: "0"
    tidewater-seller: "0"

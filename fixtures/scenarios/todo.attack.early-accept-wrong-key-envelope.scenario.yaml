# @settlement sim @judges recorded @mode guaranteed_on_decision @seed 241
name: todo.attack.early-accept-wrong-key-envelope
description: >-
  Known gap (sim batch 1, F2; T-024). Tidewater seals Atlas's content-key envelope to a key Atlas does not
  hold, naming Atlas as the recipient; settlement cannot tell and records the delivery. Atlas's agent skips
  the open-your-envelope check that examples/verify.ts now enforces and accepts early, so the price goes to
  Tidewater and the misdirected envelope is released. Atlas cannot open the work. ADR-0012 makes a missing or
  wrong key an appeal ground, but settlement refuses any appeal after an early accept ("nothing to appeal
  after early_accept"), so the recourse does not work end to end today. Restore as attack.* once an appeal
  (or another remedy) on the missing-or-wrong-key ground is possible after an early accept.
club: fixtures/clubs/data-services-v1.yaml
terms: fixtures/terms/clean-customers-2000.yaml
parties:
  buyer: atlas-buyer
  seller: tidewater-seller
adjudicators:
  primary: bench-a
  fallback: bench-b
  appeal: bench-c
operators: [op-1, op-2]
faucet:
  atlas-buyer: "10000000000"
  bench-a: "25000000000"
  bench-b: "25000000000"
  bench-c: "25000000000"
steps:
  - offer:              { by: seller, via: op-1 }
  - adjudicator_accept: { via: op-1 }
  - agree_and_fund:     { by: buyer, via: op-1 }
  - deliver:            { by: seller, via: op-1, file: data/dataset-cleaning/customers.clean.csv, buyer_envelope: wrong_key }
  - early_accept:       { by: buyer, via: op-1 }
  - verify_key_release: { by: buyer, via: op-1 }
  - appeal:             { by: buyer, via: op-1, grounds: missing-or-wrong-key }
expect:                             # today's outcome (measured): Atlas paid and cannot open the work or appeal
  terminal: Released
  balances:
    atlas-buyer: "8000000000"
    tidewater-seller: "2000000000"

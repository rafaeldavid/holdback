# Terms template for a security-audit report delivered as one JSON document (T-317). Checks-only: the
# rubric is empty, so the four required checks below decide and no panel sits. An optional rubric for
# the same job is in spec/examples/commitment.audit-report.example.json.
#
# What a party changes when it copies this template: the commit (description and `scope`), the list of
# files in scope (description, `scope` and `coverage`, with minItems and maxItems equal to the number of
# files), the severity scale, the price and the windows.
#
# The json_schema check walks a subset of JSON Schema and refuses any keyword outside it
# (packages/judgment/src/checks/json-schema.ts); site/llms.txt, "Writing checks for a report", lists the
# subset. Field rules are as in clean-customers-2000.yaml.
schemaVersion: "0.7"
clubId: data-services-v1
deliverable:
  kind: document
  description: "Security review of the lending-vault code at commit 7c1e4b9a2d3f5068a1b2c3d4e5f60718293a4b5c. Scope: contracts/Vault.sol, contracts/InterestModel.sol and contracts/PriceFeed.sol. Deliver one JSON report with the commit reviewed, the files reviewed and the findings. Each finding has an id, a severity, a title, the file, the line range, the code excerpt it is about, the root cause, the impact and a recommended fix. A finding rated Medium or higher also carries the proof-of-concept files that show it. Severity scale: Critical, anyone can take or lock funds with no special access; High, funds can be taken or locked only with a precondition such as a privileged role or an unusual market state; Medium, the code breaks a stated rule or loses a bounded amount; Low, a defect that puts no funds at risk; Info, a note on clarity, style or cost. A report with no findings is a complete report."
  format: application/json
acceptance:
  deterministicChecks:
    # The report's shape. No property outside the ones named here is allowed.
    - id: report
      type: json_schema
      required: true
      schema:
        type: object
        additionalProperties: false
        required: [commit, filesReviewed, findings]
        properties:
          commit: { type: string, pattern: "^[0-9a-f]{40}$" }
          filesReviewed:
            type: array
            items: { type: string, minLength: 1, maxLength: 200 }
          findings:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [id, severity, title, file, lines, excerpt, rootCause, impact, recommendedFix]
              properties:
                id: { type: string, pattern: "^F-[0-9]{2,4}$" }
                severity: { enum: [Critical, High, Medium, Low, Info] }
                title: { type: string, minLength: 1, maxLength: 200 }
                file: { type: string, minLength: 1, maxLength: 200 }
                lines:
                  type: object
                  additionalProperties: false
                  required: [start, end]
                  properties:
                    start: { type: integer, minimum: 1 }
                    end: { type: integer, minimum: 1 }
                excerpt: { type: string, minLength: 1, maxLength: 2000 }
                rootCause: { type: string, minLength: 1, maxLength: 2000 }
                impact: { type: string, minLength: 1, maxLength: 2000 }
                recommendedFix: { type: string, minLength: 1, maxLength: 2000 }
                pocFiles:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [path, content]
                    properties:
                      path: { type: string, minLength: 1, maxLength: 200 }
                      content: { type: string, minLength: 1, maxLength: 20000 }
              # Proof by severity: a finding is Low or Info, or it carries proof-of-concept files.
              anyOf:
                - properties: { severity: { enum: [Low, Info] } }
                - required: [pocFiles]
    # The agreed commit, and every finding in a file of the agreed scope.
    - id: scope
      type: json_schema
      required: true
      schema:
        type: object
        required: [commit, findings]
        properties:
          commit: { const: "7c1e4b9a2d3f5068a1b2c3d4e5f60718293a4b5c" }
          findings:
            type: array
            items:
              type: object
              required: [file]
              properties:
                file: { enum: [contracts/Vault.sol, contracts/InterestModel.sol, contracts/PriceFeed.sol] }
    # Coverage in any order: three distinct entries, each from the scope, is the scope itself.
    - id: coverage
      type: json_schema
      required: true
      schema:
        type: object
        required: [filesReviewed]
        properties:
          filesReviewed:
            type: array
            uniqueItems: true
            minItems: 3
            maxItems: 3
            items: { enum: [contracts/Vault.sol, contracts/InterestModel.sol, contracts/PriceFeed.sol] }
    - { id: hidden, type: hidden_characters_max, required: true, max: { total: 0 } }
  rubric:
    passThreshold: 0
    criteria: []
price: { token: tUSD, amount: "1500000000" }
adjudication:
  policyId: bench-a/p1
  fee: { token: tUSD, amount: "50000000" }
timing:
  offerExpiresInSec: 900
  fundWithinSec: 1800
  deliverWithinSec: 604800
  judgeWithinSec: 120
  fallbackWithinSec: 120
  appealWindowSec: 300
  appealDecideSec: 300
  maxSubmissions: 1
settlement: { mode: guaranteed_on_decision, token: tUSD }
remedy: { onReject: full_refund }
disclosure: { level: public }

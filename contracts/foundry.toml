[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# T-209: the drand verifier uses the EIP-2537 BLS12-381 precompiles, live from the Prague hardfork.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# T-202: the settlement view and the decision struct need the IR pipeline (stack depth); it also keeps
# HoldbackRules under the EIP-170 runtime size limit.
via_ir = true
# Local chain only (anvil, chain id 31337). No RPC endpoints are configured on purpose.
chain_id = 31337
gas_reports = ["AuthCaptureEscrow", "HoldbackRules"]
# NoAdmin.t.sol reads the compiled ABI to check the selector allowlist.
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "../fixtures/beacon" }]

[fmt]
line_length = 120

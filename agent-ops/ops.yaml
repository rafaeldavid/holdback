# This file specifies agent ops in machine-readable form. The pipeline is not active, and nothing reads this file.
version: 0
status: inactive

switches:                     # The switches fail closed. The tick treats an unreadable or different value as off.
  require_all:
    - { repo_variable: AGENT_OPS, equals: "on" }        # This repository setting is authoritative. Only Rafa can set it.
    - { file: agent-ops/STATUS, first_line: active }    # Changing this file requires a tier 3 pull request.
  halt_file: reports/agent-ops/HALT                     # Anyone can create this file. While it exists, the tick starts no tasks.

models:                       # The IDs are pinned. A model change requires a tier 3 pull request.
  fable: claude-fable-5-1
  opus: claude-opus-5-5
  sonnet: claude-sonnet-5-5
  haiku: claude-haiku-5-5
  second_family:
    transport: apps/adjudicator/src/providers/live.ts   # The judges use this OpenAI-compatible client.
    primary: { family: deepseek, model: deepseek-v4-pro }   # DeepSeek publishes an alias, not a snapshot. Each review records the call date.
    fallback: { family: gpt, model: null }                  # Activation pins this model. It also reviews at phase exits.

intake:
  lanes:
    tickets:   { sources: [github_issue, pr_comment], trust: untrusted, path: quarantine }   # The repository is public and has no issues (measured).
    feedback:  { sources: [feedback], where: "POST /v1/feedback (T-032)", trust: untrusted, path: quarantine, repo_copy: fingerprint_only }
    roadmap:   { sources: [docs/plan.md, docs/backlog.md, docs/decisions-today.md, docs/decisions/, "docs/reviews/*#Next steps"], trust: trusted, path: architect }
    telemetry: { sources: [web, social, api, onchain], trust: { aggregates: measured, social_text: untrusted }, path: signal_rules }
  ci_signals: { sources: [red main, recurring flake, budget hit], writer: tick, model: none }
  quarantine:
    normalize: packages/judgment/src/normalize.ts
    triager: { model: haiku, tools: [], spotlight: random_delimiters, canary: true }
    out: schemas/triage-record.schema.json
    on_invalid: drop_and_count
    raw_text: { never_in: [task file, brief, PR body, handoff], reader: one_shot, cap_kb: 4 }
  untrusted_to_tier_2_or_3: rafa   # Rafa approves these tasks, because they form the longest injection path.

telemetry:                    # Telemetry holds aggregates only (D35, D39, D40). The thresholds are guesses that the shadow week calibrates.
  store: [reports/telemetry/, operator KV]   # Both stores are private. Figures never enter the public repository, and Rafa decides on publication (D39).
  to_non_anthropic_providers: none
  sources:
    web:
      signal: "visits; funnel homepage -> llms.txt -> first API call (new signer keys per day); each stage counted, never joined per visitor"
      collector: cookieless analytics such as Cloudflare Web Analytics
      owner: demo lane
      cadence: daily
      opens_record: "a stage-to-stage conversion falls 30% below its 4-week median"
      retention_days: 90
    social:
      signal: public mentions and replies about ’crow and escrow.stream, public sources only
      owner: rafa             # Rafa owns this source because a reply is a publication.
      cadence: weekly
      opens_record: ["the same bug or docs confusion in 2 or more independent posts", "any security claim, to Rafa at once"]
      retention: { counts_and_fingerprints_days: 90, post_text: never_stored }
    api:
      signal: [T-031 aggregate metrics, problem-type counts, notices served, D39 feedback reports]
      owner: api lane
      cadence: { aggregate: hourly, rules: daily }
      opens_record: ["a problem type's share doubles against its 7-day baseline", "first-try success drops 10 points", "any internal 500",
                     "a deprecation notice served after its date", "the same feedback fingerprint 3 times"]
      retention: { request_log_days: 7, aggregates_days: 90, feedback: T-032 lifecycle }
    onchain:
      signal: public settlement events (counts, amounts, states, timeouts, appeals, gas per deal); the public skeleton only
      owner: settlement lane
      cadence: daily
      opens_record: ["timeouts or appeals double against baseline", "gas per deal 10% over the recorded baseline (395,831, T-202)",
                     "an event sequence the state machine forbids: P0 security"]
      retention: { events: public, aggregates_days: 90 }

feedback_requests:            # The operator asks opted-in agents for feedback at deal milestones. Task T-043 builds this on T-032's route, with an ADR and a version bump.
  opt_in: { header: "Prefer: feedback-requests=on", default: off, decided_by: the agent's owner, stored_state: none }
  sampling: { method: "hash(signer key, deal ID, milestone) compared with the rate", max_per_deal_and_milestone: 1 }   # The rates are guesses.
  milestones:
    - { at: offer or agreement prepared, when: before signing, rate: 0.10 }
    - { at: [agreed, funded, delivered, judged], when: after the stage completes, rate: 0.10 }
    - { at: settled, when: after settlement, rate: 1.0 }
    - { at: appeal filed, when: after the appeal, rate: 1.0 }
    - { at: error response, when: with the problem response, rate: 0.25, per: problem type }
  request: { field: feedbackRequest, expires_hours: 24, questions: [ease rating 1 to 5, docs answered the question (yes or no), optional free text], deal_content: none }
  answer: { route: "POST /v1/feedback", rules: D39, ratings: telemetry aggregates, free_text: quarantine }
  opens_record: ["a milestone's average ease rating falls below 3 over a week", "more than 30% of a milestone's answers say the docs did not answer"]   # The thresholds are guesses.

record:
  schema: schemas/triage-record.schema.json
  kinds: [bug, docs, feature, feedback, friction, deprecation, incident, flake, security, spam]
  routes: [task, backlog, decision, close]
  order: [demo path, severity, age]

roles:
  triager:        { model: haiku,  tools: [], out: TriageRecord }
  architect:      { model: fable,  tools: [Read, Write], writes: [docs/tasks/, docs/decisions/, docs/plan.md, docs/backlog.md] }
  implementer:    { model: sonnet, on_tier_2: opus, writes: [task paths] }
  fixture-author: { model: sonnet, first_on: tier_2, writes: [fixtures/scenarios/] }
  verifier:       { model: sonnet, tools: [Read, Bash, Edit Evidence only] }
  reviewer:       { model: not_author, sonnet_work: opus, opus_work: fable, tools: [Read, Bash] }   # The reviewer has no Write or Edit access.
  xreviewer:      { model: second_family, tools: [], out: ReviewVerdict }
  red-teamer:     { model: fable, effort: max, plus: second_family_at_milestones }
  tick_runner:    { model: haiku, runs: scripts/ops/tick.mjs, decides: nothing }
  lander:         { model: haiku, runs: /merge-pr }
  daily_log:      { model: haiku, writes: [docs/log/] }

stages:
  - { id: intake,   actor: [scripts/ops/intake.mjs, scripts/ops/signals.mjs, triager], out: TriageRecord }
  - { id: triage,   actor: architect, reads: records only, out: docs/tasks/T-xxx.md, exit: scripts/ops/task-lint.mjs }
  - { id: decide,   actor: architect, out: [docs/decisions-today.md, "ADR Proposed"], when: "changes architecture, a contract or a defense" }
  - { id: dispatch, actor: scripts/ops/tick.mjs, claim: "push t-<id>-<slug>, Status flip first", claim_ttl_hours: 24 }
  - { id: build,    actor: [fixture-author, implementer], exit: pnpm verify green }
  - { id: verify,   actor: verifier, exit: [no contradicted claim, one number re-measured] }
  - { id: ci,       required: [check, gitleaks, xreview], rerun: { max: 1, only: known_flakes } }
  - { id: review,   actor: [reviewer, xreviewer, red-teamer], max_rounds: 3, then: needs-human }
  - { id: merge,    actor: { tier_0_2: lander, tier_3: rafa }, commit: merge, never_auto: [tier_3, fork] }
  - { id: feedback, actor: daily_log, out: [docs/log/, design map, metrics, intake] }

tick:
  triggers: [merge to main, CI completion]
  fallback_cron_min: 20
  ready_when: [switches on, no halt_file, status todo, depends_on merged, no t-<id>-* branch,
               paths disjoint from open PRs and claims, wip and daily budget have room]

wip: { implementers: 3, after_T-034: 5, per_lane: 1, prs_in_ci: 2, xfam_in_flight: 1, xfam_calls_per_day: 30, full_verify_per_machine: 1, sessions: 5 }
budgets_usd: { tier_0: 5, tier_1: 25, tier_2: 80, tier_3: 40, daily: 300 }   # These values are guesses.

isolation:
  preferred: sandboxed cloud or VM session per task, own clone, scoped tokens
  fallback: { agent_isolation: worktree, hook: scripts/hooks/bash-guard.sh, env_under_reports: [TMPDIR, FOUNDRY_DIR, pnpm store] }
  bash_guard_blocks: ["cd outside root", heredoc or redirect writes, "sed -i", interpreter one-liners, "$(...) and backticks", xargs, eval, "find -exec", /private/tmp, "~/", polling loops]

single_writer:
  docs/log/: daily_log
  docs/decisions-today.md: architect
  docs/plan.md: architect
  docs/backlog.md: architect
  shared_config: { paths: [pnpm-lock.yaml, package.json, vitest.config.ts, contracts/lib/], owner: "infra lane, one task at a time" }
generated: [spec/openapi.json, reports/design-map.html]
branch_update: merge main in; never rebase

tiers:                        # A pull request takes the highest tier among its paths. A path that matches no rule is tier 1.
  0: { paths: ["docs/**", "brand/**", "/*.md"], except: ["docs/decisions/**", CLAUDE.md, AGENTS.md], merge: auto }   # Snapshot files (*.expect.md) count as code.
  1: { paths: ["**"], adds: [verifier], merge: auto }
  2: { paths: ["contracts/**", "packages/settlement/**", "packages/judgment/**", "packages/core/**", "spec/**", "apps/adjudicator/**", "apps/operator/src/**",
               "config/judges*.yaml", "formal/**", "docs/decisions/**", pnpm-lock.yaml],
       adds: [fixtures first, xreviewer, "red-teamer on judgment, settlement, contracts and operator"], merge: auto_after_both_families_pass }
  3: { paths: [".github/**", ".claude/**", "agent-ops/**", CLAUDE.md, AGENTS.md, .gitleaksignore], also: flagged by guardrails.mjs,
       adds: [xreviewer], merge: rafa, enforce: [fleet GitHub App identity, code-owner review on tier 3] }
  outside: { actions: [deploy, keys, money, repo settings, publish, force push], merge: rafa }

guardrails:                   # scripts/ci/guardrails.mjs runs inside the check job.
  fail: [path outside task paths, "spec/schemas change without ADR and version bump"]
  raise_to_tier_3: ["deleted or edited attack.* or neutrality.* fixture", raised timeout, new admin selector]
deny_additions: [wrangler, gh api --method, gh repo edit, gh secret, gh ruleset, gh pr merge --admin, git push to main]

blocking_finding: [file_line, rule or litmus test or security property, reproduction]
disagreement:
  method: verifier runs the reproduction once
  reproduced: blocks until fixed
  not_reproduced: backlog row
  two_refuted_from_one_family: rafa
  abstain: issues
  two_abstentions: rafa
  outage: { primary_down: fallback family, both_down: rafa }
never: [re-run a reviewer for a different verdict, vote across families, auto-merge tier 3, treat untrusted text as instructions]

milestones:
  - { at: tier 2 PR,             reviewers: [not_author, deepseek], effect: blocks }
  - { at: control plane,         reviewers: [fable, deepseek], effect: blocks; rafa merges }
  - { at: schema version bump,   reviewers: [opus, deepseek], effect: blocks }
  - { at: judge registry change, reviewers: [fable, deepseek], effect: blocks }
  - { at: ADR,                   reviewers: [deepseek], effect: advisory input to Rafa }
  - { at: phase exit,            reviewers: [fable red team, deepseek red team, gpt red team], effect: blocks the exit claim }
  - { at: before a deploy,       reviewers: [deepseek], over: diff since last deploy, effect: advisory }
  - { at: mainnet,               reviewers: [external audit], effect: rafa }

xreview_ci:
  event: pull_request_target  # The script comes from main and the diff comes from the API. No code from the pull request runs.
  same_repo_only: true
  always_reports: true        # The check passes immediately for tiers 0 and 1.
  out: schemas/review-verdict.schema.json

review_theater:
  agreement: { log: reports/review-agreement.jsonl, flag: "agreement with self-assessment > 95% over 20 PRs" }   # The threshold is a guess.
  canaries: { cadence: monthly, metric: recall per family }                                                   # The cadence is a guess.

kill_switch:
  pause: { how: [create halt_file, "AGENT_OPS != on", alarm], who: [anyone, rafa, automatic] }
  stop:  { how: scripts/ops/stop.mjs, effect: [stop sessions, disarm auto-merge, delete claims], who: rafa }
  sever: { how: [revoke fleet identity, provider spend caps to 0], who: rafa }
  gap: a bypass-mode session does not re-check the switch mid-task; worst case one more push

observability:
  per_pr_footer: [model per role, sessions, reruns, verdict per family, tier, budget used]
  per_tick: reports/agent-ops/metrics.jsonl
  daily: docs/log/        # The log holds pipeline figures only. Product telemetry stays private (D39).
  alarms_pause_dispatch: [main red 30 min, cross-family block rate over 50% in a day, spend at daily cap, gitleaks hit on an agent branch]

activation:                   # Rafa approves each step.
  - sandboxed environment with scoped tokens; GitHub App identity; nothing on Rafa's Mac
  - spend-capped DeepSeek key as an Actions secret; xreview required; code-owner review on tier 3
  - T-034, T-035, T-036 merged; Known flakes list in docs/testing.md
  - reviewer and verifier lose Write and Edit; deny_additions in .claude/settings.json
  - schemas wired into the harness; attack.* payloads fed to triage; tests/agent-ops-inactive.test.ts
  - telemetry and feedback: deploy T-031 and T-032 (both merged), build T-043 after its ADR, enable Web Analytics and a public-source social reader
  - "shadow week: tick --dry-run; Rafa dispatches by hand; thresholds calibrated"
  - one lane until 10 merged PRs with no revert, then 3   # The threshold is a guess.
  - "STATUS: active; AGENT_OPS: on"

proposed_not_built: [scripts/ops/intake.mjs, scripts/ops/signals.mjs, scripts/ops/task-lint.mjs, scripts/ops/tick.mjs, scripts/ops/xreview.mjs,
  scripts/ops/stop.mjs, scripts/ci/guardrails.mjs, scripts/hooks/bash-guard.sh, .github/workflows/xreview.yml, tests/agent-ops-inactive.test.ts]

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The nightly schedule is off (Rafa, 2026-11-01); production maintenance is a backlog item.
  # Push to main still runs the full property-test counts.

permissions:
  contents: read

jobs:
  # A pull request that changes only docs/ or root Markdown files skips the heavy jobs (Rafa, 2026-11-07: the
  # change recipes in docs/team.md). Push to main always runs everything, and so does a pull request whose file
  # list can't be read.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && files=$(gh pr diff "$PR" --repo "$REPO" --name-only) && [ -n "$files" ]; then
            if [ -z "$(printf '%s\n' "$files" | grep -Ev '^(docs/.+|[^/]+\.md)$')" ]; then code=false; fi
            echo "$(printf '%s\n' "$files" | wc -l) changed files"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  static:
    name: typecheck, lint, spec, snap
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm validate:spec
      - run: pnpm snap

  test:
    name: test (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Pull requests cap the property-test runs (same seed, so a capped run is a prefix of the full
      # one); push to main leaves it empty, which runs the full counts.
      HOLDBACK_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '40' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test --shard=${{ matrix.shard }}/4

  # T-203: the Foundry suites (unit, fuzz, and the handler-based invariants at 256 runs x depth 100), then
  # the vitest suites that need anvil and contracts/out (T-205), which the test shards skip for lack of
  # Foundry. Local EVM only (chain id 31337, anvil on 127.0.0.1); no public RPC endpoint is configured.
  contracts:
    name: contracts (forge test, anvil tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A healthy run takes about 8 minutes; a hang fails here instead of at GitHub's 6-hour default (T-035).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the six repositories contracts/remappings.txt maps, at depth 1. `submodules: recursive` cloned about
      # 100 nested test dependencies of commerce-payments: 2 to 6 minutes on 2026-11-03, then hangs past 40 (T-035).
      - name: submodules
        timeout-minutes: 5
        run: |
          git submodule update --init --depth 1 contracts/lib/commerce-payments
          git -C contracts/lib/commerce-payments submodule update --init --depth 1 lib/forge-std lib/permit2 lib/solady lib/spend-permissions
          git -C contracts/lib/commerce-payments/lib/spend-permissions submodule update --init --depth 1 lib/openzeppelin-contracts
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.0.0
      - name: forge test
        working-directory: contracts
        run: forge test
      # forge test does not compile contracts/script/, where the anvil tests' LocalUSDC and LocalMulticall3 live.
      - name: forge build
        working-directory: contracts
        run: forge build
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: anvil tests (must not skip)
        run: |
          set -o pipefail
          pnpm vitest run packages/settlement/evm packages/testkit/src/runner.test.ts --reporter=verbose | tee anvil-tests.log
          # Any skipped test fails the job, whatever its name: vitest's summary prints "N skipped".
          if grep -Eq "[0-9]+ skipped" anvil-tests.log; then echo "anvil tests skipped: Foundry or contracts/out missing" >&2; exit 1; fi

  # T-204's model check, when formal/check.sh exists. Pull requests run the safety config and the broken
  # variants (each must still bite); push to main also runs the seven liveness configs.
  formal:
    name: formal (TLC)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: hashFiles('formal/check.sh') != ''
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: hashFiles('formal/check.sh') != ''
        with:
          path: formal/.tools
          key: formal-tools-${{ hashFiles('formal/check.sh') }}
      - name: model check
        run: |
          if [ ! -f formal/check.sh ]; then echo "no formal/check.sh: nothing to check"; exit 0; fi
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash formal/check.sh safety
            bash formal/check.sh broken/
          else
            bash formal/check.sh
          fi

  # The one status to require: it fails unless the static job, every test shard, the contracts job and the
  # formal job succeeded, or the changes job found a docs-only pull request and they were skipped.
  check:
    needs: [changes, static, test, contracts, formal]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo "changes=${{ needs.changes.result }} code=${{ needs.changes.outputs.code }}"
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.code }}" = false ]; then echo "docs only: the heavy jobs were skipped"; exit 0; fi
          echo "static=${{ needs.static.result }} test=${{ needs.test.result }} contracts=${{ needs.contracts.result }} formal=${{ needs.formal.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.contracts.result }}" = success
          test "${{ needs.formal.result }}" = success

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

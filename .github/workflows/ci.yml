name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The nightly schedule is off (Rafa, 2026-11-01); production maintenance is a backlog item.
  # Push to main still runs the full property-test counts.

permissions:
  contents: read

jobs:
  static:
    name: typecheck, lint, spec, snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm validate:spec
      - run: pnpm snap

  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Pull requests cap the property-test runs (same seed, so a capped run is a prefix of the full
      # one); push to main and the nightly schedule leave it empty, which runs the full counts.
      HOLDBACK_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '40' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test --shard=${{ matrix.shard }}/4

  # The one status to require: it fails unless the static job and every test shard succeeded.
  check:
    needs: [static, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo "static=${{ needs.static.result }} test=${{ needs.test.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.test.result }}" = success

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The nightly schedule is off (Rafa, 2026-11-01); production maintenance is a backlog item.
  # Push to main still runs the full property-test counts.

permissions:
  contents: read

jobs:
  static:
    name: typecheck, lint, spec, snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm validate:spec
      - run: pnpm snap

  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Pull requests cap the property-test runs (same seed, so a capped run is a prefix of the full
      # one); push to main leaves it empty, which runs the full counts.
      HOLDBACK_PROPERTY_RUNS: ${{ github.event_name == 'pull_request' && '40' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test --shard=${{ matrix.shard }}/4

  # T-203: the Foundry suites (unit, fuzz, and the handler-based invariants at 256 runs x depth 100), then
  # the vitest suites that need anvil and contracts/out (T-205), which the test shards skip for lack of
  # Foundry. Local EVM only (chain id 31337, anvil on 127.0.0.1); no public RPC endpoint is configured.
  contracts:
    name: contracts (forge test, anvil tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.0.0
      - name: forge test
        working-directory: contracts
        run: forge test
      # forge test does not compile contracts/script/, where the anvil tests' LocalUSDC and LocalMulticall3 live.
      - name: forge build
        working-directory: contracts
        run: forge build
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: anvil tests (must not skip)
        run: |
          set -o pipefail
          pnpm vitest run packages/settlement/evm packages/testkit/src/runner.test.ts --reporter=verbose | tee anvil-tests.log
          # Any skipped test fails the job, whatever its name: vitest's summary prints "N skipped".
          if grep -Eq "[0-9]+ skipped" anvil-tests.log; then echo "anvil tests skipped: Foundry or contracts/out missing" >&2; exit 1; fi

  # T-204's model check, when formal/check.sh exists. Pull requests run the safety config and the broken
  # variants (each must still bite); push to main also runs the seven liveness configs.
  formal:
    name: formal (TLC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: hashFiles('formal/check.sh') != ''
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: hashFiles('formal/check.sh') != ''
        with:
          path: formal/.tools
          key: formal-tools-${{ hashFiles('formal/check.sh') }}
      - name: model check
        run: |
          if [ ! -f formal/check.sh ]; then echo "no formal/check.sh: nothing to check"; exit 0; fi
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash formal/check.sh safety
            bash formal/check.sh broken/
          else
            bash formal/check.sh
          fi

  # The one status to require: it fails unless the static job, every test shard, the contracts job and the
  # formal job succeeded.
  check:
    needs: [static, test, contracts, formal]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo "static=${{ needs.static.result }} test=${{ needs.test.result }} contracts=${{ needs.contracts.result }} formal=${{ needs.formal.result }}"
          test "${{ needs.static.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.contracts.result }}" = success
          test "${{ needs.formal.result }}" = success

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

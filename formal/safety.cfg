\* Safety: every actor active (no halt), two commitments, every deadline ordering, every message kind.
\* With no fairness on named actors this already covers every behaviour in which any of them stops.
SPECIFICATION Spec
CONSTANTS
  C = {c1, c2}
  Halted = "none"
  Bug = "none"
INVARIANTS
  TypeOK
  Conservation
  NonNegative
  SettleOnce
  EscrowMatchesState
  KeyOnlyWithPayment
  ExpiryAfterCaptures
  BondCovered
  EncMatchesDeals
  BondsReleasedAtClose
PROPERTIES
  AuthorizedMoves
  AtomicKey
  NoCaptureAfterExpiry

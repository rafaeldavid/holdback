\* Safety, full profile, each money address equal to its signing address: every actor active, two commitments,
\* every deadline order, every message kind. With no fairness on named actors this covers every behaviour in
\* which any of them stops.
SPECIFICATION Spec
CONSTANTS
  C = {c1, c2}
  Halted = "none"
  Bug = "none"
  Profile = "full"
  Apart = {}
INVARIANTS
  TypeOK
  Conservation
  NonNegative
  SettleOnce
  EscrowMatchesState
  ExpiryAfterCaptures
  EscrowLedger
  PaidAsClosed
  ReasonRules
  ReasonMatchesMoney
  DefaultRefundsBuyer
  KeyOnlyWithPayment
  RefundedNeverReleasedKey
  BondCovered
  EncMatchesDeals
  BondsReleasedAtClose
PROPERTIES
  AuthorizedMoves
  AuthorizedSteps
  PaymentAddressFunds
  SignersOnlyStake
  FirstDecisionFinal
  LapsedOfferNeverFunds
  AtomicKey
  NoCaptureAfterExpiry
  BondMoneyLands

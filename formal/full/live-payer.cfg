\* Liveness, full profile, money addresses apart, with the buyer's payment address halting at some point (any point):
\* after that it funds nothing and never reclaims on the escrow (ADR-0033).
SPECIFICATION Spec
CONSTANTS
  C = {c1, c2}
  Halted = "buyer_pay"
  Bug = "none"
  Profile = "full"
  Apart = {"buyer", "seller"}
INVARIANTS
  TypeOK
  Conservation
  SettleOnce
PROPERTIES
  AuthorizedMoves
  AuthorizedSteps
  PaymentAddressFunds
  SignersOnlyStake
  FirstDecisionFinal
  LapsedOfferNeverFunds
  AtomicKey
  NoCaptureAfterExpiry
  BondMoneyLands
  FundedSettles
  FundedFinal
  OfferEnds
  BondsFreed

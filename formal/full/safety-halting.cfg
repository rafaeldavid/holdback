\* Safety, full profile, money addresses apart, with one actor halting at some point: any named actor, at any point.
\* This is the config that checks signatures: a step that names a signer needs that actor able to act.
SPECIFICATION Spec
CONSTANTS
  C = {c1, c2}
  Halted = "any"
  Bug = "none"
  Profile = "full"
  Apart = {"buyer", "seller"}
INVARIANTS
  TypeOK
  Conservation
  NonNegative
  SettleOnce
  EscrowMatchesState
  ExpiryAfterCaptures
  EscrowLedger
  PaidAsClosed
  ReasonRules
  ReasonMatchesMoney
  DefaultRefundsBuyer
  KeyOnlyWithPayment
  RefundedNeverReleasedKey
  BondCovered
  EncMatchesDeals
  BondsReleasedAtClose
PROPERTIES
  AuthorizedMoves
  AuthorizedSteps
  PaymentAddressFunds
  SignersOnlyStake
  FirstDecisionFinal
  LapsedOfferNeverFunds
  AtomicKey
  NoCaptureAfterExpiry
  BondMoneyLands

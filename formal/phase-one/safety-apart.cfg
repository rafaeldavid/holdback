\* Safety, phase-one profile (the contracts), both money addresses apart from the signing addresses (ADR-0033):
\* the payment and payout addresses hold all the money; the signing addresses hold nothing at any step.
SPECIFICATION Spec
CONSTANTS
  C = {c1, c2}
  Halted = "none"
  Bug = "none"
  Profile = "phase_one"
  Apart = {"buyer", "seller"}
INVARIANTS
  TypeOK
  Conservation
  NonNegative
  SettleOnce
  EscrowMatchesState
  ExpiryAfterCaptures
  PhaseOneCuts
  EscrowLedger
  PaidAsClosed
  ReasonRules
  ReasonMatchesMoney
  DefaultRefundsBuyer
  SignersHoldNothing
  KeyOnlyWithPayment
  RefundedNeverReleasedKey
PROPERTIES
  AuthorizedMoves
  AuthorizedSteps
  PaymentAddressFunds
  SignersOnlyStake
  FirstDecisionFinal
  LapsedOfferNeverFunds
  AtomicKey
  NoCaptureAfterExpiry

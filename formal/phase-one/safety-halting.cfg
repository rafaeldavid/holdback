\* Safety, phase-one profile, money addresses apart, with one actor halting at some point: any named actor, at any
\* point. This is the config that checks signatures: a step that names a signer needs that actor able to act.
SPECIFICATION Spec
CONSTANTS
  C = {c1, c2}
  Halted = "any"
  Bug = "none"
  Profile = "phase_one"
  Apart = {"buyer", "seller"}
INVARIANTS
  TypeOK
  Conservation
  NonNegative
  SettleOnce
  EscrowMatchesState
  ExpiryAfterCaptures
  PhaseOneCuts
  EscrowLedger
  PaidAsClosed
  DefaultRefundsBuyer
  SignersHoldNothing
  KeyOnlyWithPayment
  RefundedNeverReleasedKey
PROPERTIES
  AuthorizedMoves
  AuthorizedSteps
  PaymentAddressFunds
  SignersOnlyStake
  FirstDecisionFinal
  LapsedOfferNeverFunds
  AtomicKey
  NoCaptureAfterExpiry

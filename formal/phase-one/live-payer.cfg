  C = {c1, c2}
  Halted = "buyer_pay"
  Bug = "none"
  Profile = "phase_one"
  Apart = {"buyer", "seller"}
INVARIANTS
  TypeOK
  Conservation
  SettleOnce
  PhaseOneCuts
PROPERTIES
  AuthorizedMoves
  AuthorizedSteps
  PaymentAddressFunds
  SignersOnlyStake
